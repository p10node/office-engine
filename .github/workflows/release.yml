name: Release

# Release = push a branch named after the version:
#
#   git switch -c v0.2.0 main && git push -u origin v0.2.0
#
# The workflow then runs CI, sets package.json "version" to match the branch
# (committing `chore(release): v0.2.0` onto the branch if it differs), creates
# and pushes the `v0.2.0` tag, creates the GitHub release and publishes to npm.
#
# Packages: @p10node/office-engine and the standalone SDK packages in
# packages/* (@p10node/diagram, mermaid, plantuml, graphviz, markdown) are
# released together, all at the branch's version (they share the engine code).
#
# - Release notes: docs/releases/<tag>.md is optional. If present it goes on
#   top, GitHub's generated commit list below it.
# - Prereleases (`v0.2.0-rc.1`) are marked prerelease on GitHub and go to the
#   `next` npm dist-tag; everything else goes to `latest`.
# - Re-running is safe: an existing tag, release or npm version is reused.
# - Versions are immutable: pushing new commits to a branch whose tag already
#   exists fails. Cut a new version branch instead.
#
# npm auth is Trusted Publishing (OIDC), no token secret. Each npm package
# must trust this repo + `release.yml` with `npm publish` allowed; see
# docs/development.md. npm trusts existing packages only: a new package is
# bootstrapped once, with a hand-published placeholder or, for one release,
# the NPM_TOKEN secret (granular token with publish rights on @p10node).

on:
  push:
    branches: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push release commit + tag, create GitHub release
      id-token: write # npm provenance / trusted publishing
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags and the remote branch head

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Branch '$TAG' is not a version (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-pre)"
            exit 1
          fi
          version="${TAG#v}"
          case "$version" in *-*) dist_tag=next; pre=true ;; *) dist_tag=latest; pre=false ;; esac

          head=$(git rev-parse "origin/$TAG")
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$tagged" != "$head" ]; then
              echo "::error::Tag $TAG already exists at ${tagged:0:7} but branch $TAG is at ${head:0:7}. Versions are immutable: cut a new version branch."
              exit 1
            fi
            git checkout -q "refs/tags/$TAG"
            tagged=true
          else
            if [ "$GITHUB_SHA" != "$head" ]; then
              echo "::error::Branch $TAG moved to ${head:0:7} after this run started; the run for that push releases it."
              exit 1
            fi
            tagged=false
          fi

          {
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "prerelease=$pre"
            echo "tagged=$tagged"
          } >> "$GITHUB_OUTPUT"

      - name: Set version and push tag
        if: steps.meta.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the library and every SDK package get the version
          for pkg in . packages/*; do
            if [ "$(jq -r .version "$pkg/package.json")" != "$VERSION" ]; then
              (cd "$pkg" && npm version "$VERSION" --no-git-tag-version)
            fi
          done
          if ! git diff --quiet; then
            git commit -am "chore(release): $TAG"
          fi
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin "HEAD:refs/heads/$TAG" "refs/tags/$TAG"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:packages

      # one tarball per package, in $RUNNER_TEMP/packs (the library's first)
      - name: Pack
        id: pack
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/packs"
          mkdir -p "$dir"
          for pkg in . packages/*; do
            v=$(jq -r .version "$pkg/package.json")
            if [ "$v" != "$VERSION" ]; then
              echo "::error::$pkg/package.json is at $v, not $VERSION"
              exit 1
            fi
            (cd "$pkg" && npm pack --silent --pack-destination "$dir" | tail -1)
          done
          ls -1 "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          PACKS: ${{ steps.pack.outputs.dir }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi
          args=(--title "$TAG" --generate-notes --verify-tag)
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            echo "::notice::no $notes, publishing with generated notes only"
          fi
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" "$PACKS"/*.tgz

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
          PACKS: ${{ steps.pack.outputs.dir }}
          # only for a package's first version (see the top of this file)
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # without the secret: trusted publishing (OIDC) alone, as for every later version
          if [ -n "$NPM_TOKEN" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          failed=0
          for pkg in . packages/*; do
            name=$(jq -r .name "$pkg/package.json")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
              continue
            fi
            tarball="$PACKS/$(echo "${name#@}" | tr / -)-$VERSION.tgz"
            # keep going: one package's failure (e.g. not trusted yet) does not hold back the others
            if npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"; then
              echo "published $name@$VERSION"
            else
              echo "::error::publishing $name@$VERSION failed"
              failed=1
            fi
          done
          exit $failed
