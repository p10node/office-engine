name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      - name: Check package contents
        run: npm pack --dry-run

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      # same version as the playwright-core devDependency
      - run: bunx playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # large-* samples are gitignored; the pptx tests load large-deck.pptx
      - name: Generate the large deck
        run: |
          pip install python-pptx Pillow
          python scripts/fixtures.py --large-deck

      - run: bun run test:e2e
